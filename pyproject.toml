[project]
name = "informatica-dbt-bridge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PilotChalkanov", email = "nik.chalkanov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage>=7.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
idbb = "informatica_dbt_bridge.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[tool.bandit]
# B608 (possible SQL injection via string-built queries) is a structural
# false positive for this whole codebase: the f-strings it flags in
# render.py/translators/*.py are the tool's *output* - dbt model SQL text
# written to a .sql file - never a query string handed to a DB driver or
# cursor.execute(). There is no live SQL execution anywhere in this
# project. B405/B314 (stdlib XML parsing) are intentionally left active -
# see the open question about untrusted PowerCenter XML exports.
skips = ["B608"]
